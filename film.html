<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>时·光 · Jidong Mei</title>
  <link rel="stylesheet" href="assets/site.css" />
  <link rel="stylesheet" href="film.css" />
</head>
<body class="locked">

  <!-- ============ 封面（上拉解锁） ============ -->
  <div id="cover" class="cover" role="dialog" aria-label="封面">
    <div class="cover__handle" id="coverHandle" tabindex="0" role="button" aria-label="向上滑动解锁">
      <div class="cover__handle-line"></div>
      <span class="cover__handle-text">上滑</span>
    </div>
    <div class="cover__hint" id="coverHint" aria-hidden="true">继续向上</div>
  </div>

  <!-- ============ 顶部导航（解锁后浮现） ============ -->
  <header class="site-nav film-nav">
    <a class="site-nav__brand" href="index.html">Jidong Mei</a>
    <nav class="site-nav__links">
      <a href="academic.html">学术</a>
      <a href="demo.html">demo</a>
      <a href="story/index.html">故事</a>
      <a href="film.html" class="active">时·光</a>
      <a href="poetry.html">诗</a>
    </nav>
  </header>

  <!-- ============ 视频舞台 ============ -->
  <main class="film-stage" id="filmStage">
    <div class="film-frame">
      <video id="film" class="film-video" src="media/feet.mp4" preload="auto" playsinline></video>
    </div>
    <p class="film-title">时·光</p>
    <p class="film-hint">点击暂停 · 再点继续</p>
  </main>

  <script src="film.js"></script>
</body>
</html>
