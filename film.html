<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%225%22 fill=%22%233a5bd0%22/%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>微电影 — Jidong Mei</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&family=JetBrains+Mono:wght@400&display=swap" />
  <link rel="stylesheet" href="assets/site.css" />
  <link rel="stylesheet" href="film.css" />
</head>
<body class="locked">

  <!-- ============ 封面（下滑解锁） ============ -->
  <div id="cover" class="cover" role="dialog" aria-label="封面">
    <a class="cover__back" href="index.html">← 主页</a>
    <div class="cover__inner">
      <span class="cover__tag">Film</span>
      <h1 class="cover__title"><span class="initial">微</span>电影</h1>
      <p class="cover__subtitle">时·光</p>
    </div>
    <div class="cover__handle" id="coverHandle" tabindex="0" role="button" aria-label="向下滑动解锁">
      <span class="cover__handle-text">下滑</span>
      <div class="cover__handle-line"></div>
    </div>
    <div class="cover__hint" id="coverHint" aria-hidden="true">继续向下</div>
  </div>

  <!-- ============ 顶部导航（解锁后浮现） ============ -->
  <header class="nav film-nav">
    <a class="nav__brand" href="index.html"><span class="nav__mark"></span>Jidong Mei</a>
    <nav class="nav__links" aria-label="主导航">
      <a class="link-roll" href="index.html#work"><span>Work</span><span>Work</span></a>
      <a class="link-roll" href="index.html#about"><span>About</span><span>About</span></a>
      <a class="link-roll" href="index.html#research"><span>Research</span><span>Research</span></a>
      <a class="link-roll is-active" href="index.html#archive"><span>Archive</span><span>Archive</span></a>
    </nav>
    <div class="nav__aside"><a class="link-roll" href="story/index.html"><span>相册</span><span>相册</span></a></div>
  </header>

  <!-- ============ 视频舞台 ============ -->
  <main class="film-stage" id="filmStage">
    <div class="film-frame">
      <video id="film" class="film-video" src="media/feet.mp4" preload="metadata" muted loop playsinline data-cursor="Play"></video>
      <div class="film-meta">
        <p class="film-title"><span class="initial">f</span>eet</p>
        <p class="film-hint">点击观看</p>
      </div>
    </div>
  </main>

  <script src="film.js"></script>
</body>
</html>
