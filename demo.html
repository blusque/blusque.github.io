<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>demo · Jidong Mei</title>
  <link rel="stylesheet" href="assets/site.css" />
</head>
<body>
  <header class="site-nav">
    <a class="site-nav__brand" href="index.html">Jidong Mei</a>
    <nav class="site-nav__links">
      <a href="demo.html" class="active">demo</a>
      <a href="story/index.html">故事</a>
      <a href="film.html">时·光</a>
    </nav>
  </header>

  <main class="demo-page">
    <section class="demo-cover">
      <p class="page__label">PROJECTS</p>
      <h1 class="page__title">demo</h1>
      <div class="demo-cover__hint">
        <span class="demo-cover__line"></span>
        <span>滚动进入</span>
      </div>
    </section>

    <div class="demo-stage-wrap">
      <div class="demo-stage">
        <a class="demo-card" href="demo/run-cycle.html" aria-label="Run Cycle">
          <span class="demo-card__video">
            <video autoplay muted loop playsinline preload="metadata">
              <source src="demo/run-cycle.mp4" type="video/mp4" />
            </video>
            <span class="demo-card__enter">进入 →</span>
          </span>
        </a>

        <a class="demo-card" href="demo/motion-matching.html" aria-label="Motion Matching">
          <span class="demo-card__video">
            <video autoplay muted loop playsinline preload="metadata">
              <source src="demo/motion-matching.mp4" type="video/mp4" />
            </video>
            <span class="demo-card__enter">进入 →</span>
          </span>
        </a>

        <a class="demo-card" href="demo/basketball-retargeting.html" aria-label="Basketball 重定向">
          <span class="demo-card__video">
            <video autoplay muted loop playsinline preload="metadata">
              <source src="demo/basketball-retargeting.mp4" type="video/mp4" />
            </video>
            <span class="demo-card__enter">进入 →</span>
          </span>
        </a>

        <span class="demo-hint">↓ 滚动切换</span>
      </div>
    </div>
  </main>

  <script>
    const cards = Array.from(document.querySelectorAll('.demo-card'));
    const wrap = document.querySelector('.demo-stage-wrap');
    const stage = document.querySelector('.demo-stage');
    const hint = document.querySelector('.demo-hint');
    const N = cards.length;

    // 滚动高度随卡片数自适应：1 屏封面 + 每张卡之间约 60vh 的切换滚动
    wrap.style.height = (100 + (N - 1) * 60) + 'vh';

    const GAP = 72;         // 前后卡片之间的垂直错位
    const MAX_BLUR = 8;     // 背后卡片的模糊强度
    const MAX_SCALE = 0.05; // 背后卡片的缩小比例

    function update() {
      const maxScroll = wrap.offsetHeight - stage.offsetHeight;
      const p = maxScroll > 0
        ? Math.min(1, Math.max(0, -wrap.getBoundingClientRect().top / maxScroll))
        : 0;
      const pos = p * (N - 1);

      cards.forEach((card, i) => {
        const offset = i - pos;              // 0 = 前面，正 = 下面，负 = 上面
        const abs = Math.min(Math.abs(offset), 1);
        card.style.transform =
          `translateY(${(offset * GAP).toFixed(1)}px) scale(${(1 - abs * MAX_SCALE).toFixed(3)})`;
        card.style.filter = `blur(${(abs * MAX_BLUR).toFixed(1)}px)`;
        card.style.zIndex = 100 - Math.round(abs * 10);
        card.classList.toggle('is-active', i === Math.round(pos));
      });

      if (hint) hint.style.opacity = p > 0.02 ? '0' : '1';
    }

    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  </script>
</body>
</html>
