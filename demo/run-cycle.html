    <p class="page__label">PROJECTS · demo</p>
    <h1 class="page__title">Run Cycle</h1>

    <div class="demo-detail__player">
      <video controls playsinline preload="metadata" poster="run-cycle-making.png">
        <source src="run-cycle.mp4" type="video/mp4" />
      </video>
    </div>

    <div class="page__body demo-detail__body">
      <p class="lead">一段循环跑步动画，来自《数据驱动动画》课程（COMP7508）的角色动画练习。</p>

      <h2>制作流程</h2>
      <ul>
        <li><strong>绑定</strong> — 使用 AutoRig Pro 为角色建立完整的骨骼与控制器，并完成蒙皮；</li>
        <li><strong>动画</strong> — 参照跑步的参考图片，逐帧摆出接触、蹬地、腾空、缓冲等关键姿势，再补齐中间帧形成循环；</li>
        <li><strong>渲染</strong> — 在 Blender 中布光、设定相机后渲染输出。</li>
      </ul>

      <figure class="demo-detail__figure">
        <img src="run-cycle-making.png" alt="Blender 中的绑定与关键帧" />
        <figcaption>制作过程 · Blender 中的骨骼绑定与关键帧</figcaption>
      </figure>
    </div>
